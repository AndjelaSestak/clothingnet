<div class="max-h-[80vh] overflow-auto p-4">
  <h2 class="text-lg md:text-xl font-semibold mb-4 text-center">
    {{ data ? 'Edit Product' : 'Create Product' }}
  </h2>

  <form [formGroup]="productForm" class="space-y-4">
    <!-- polja -->
    <div class="grid grid-cols-1 gap-4">
      <!-- Name -->
      <div class="flex flex-col">
        <label class="mb-1 font-medium text-gray-700">Name</label>
        <input type="text" formControlName="name" class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Type -->
      <div class="flex flex-col">
        <label class="mb-1 font-medium text-gray-700">Type</label>
        <input type="text" formControlName="type" class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Brand -->
      <div class="flex flex-col">
        <label class="mb-1 font-medium text-gray-700">Brand</label>
        <input type="text" formControlName="brand" class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Price -->
      <div class="flex flex-col">
        <label class="mb-1 font-medium text-gray-700">Price</label>
        <input type="number" formControlName="price" class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Quantity -->
      <div class="flex flex-col">
        <label class="mb-1 font-medium text-gray-700">Quantity in Stock</label>
        <input type="number" formControlName="quantityInStock" class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Picture URL -->
      <div class="flex flex-col">
        <label class="mb-1 font-medium text-gray-700">Picture URL</label>
        <input type="text" formControlName="pictureUrl" class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <!-- Description -->
      <div class="flex flex-col">
        <label class="mb-1 font-medium text-gray-700">Description</label>
        <textarea formControlName="description" class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
      </div>
    </div>

    <div class="flex justify-end gap-2 mt-4 sticky bottom-0 bg-white pt-2">
      <button type="button" (click)="close()" class="border border-gray-300 px-4 py-2 rounded hover:bg-gray-100">Cancel</button>
      <button type="button" (click)="save()" [disabled]="productForm.invalid" class="bg-blue-600 text-white px-4 py-2 rounded disabled:opacity-50 hover:bg-blue-700">Save</button>
    </div>
  </form>
</div>
